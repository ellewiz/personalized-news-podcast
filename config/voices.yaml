# Google Cloud Text-to-Speech voice assignments — Neural2 voices (free tier:
# 1M characters/month). Browse/preview the full list at
# https://cloud.google.com/text-to-speech/docs/voices
# voice_display_name is just a human-readable label for your own reference.

tier1:
  voice_name: "en-US-Neural2-C"
  language_code: "en-US"
  voice_display_name: "Tier 1 — general briefing"

tier2:
  nj_politics:
    # NOTE: was originally "en-US-Neural2-B", which turned out not to exist
    # for the en-US locale (B shows up in Google's catalog for en-AU, not
    # en-US) — every synthesis request for this segment was silently
    # failing and getting dropped from the audio, even though the script
    # text generated fine. Switched to J, the last unused en-US letter.
    voice_name: "en-US-Neural2-J"
    language_code: "en-US"
    voice_display_name: "New Jersey Politics"
