# RSS feed sources for the podcast pipeline.
# Tier 1: digest-style general news (kept to a handful of headlines total).
# Tier 2: category-specific feeds, one list per category.

tier1_general_news:
  - name: PBS NewsHour Headlines
    url: https://www.pbs.org/newshour/feeds/rss/headlines
  - name: UPI Top News
    url: https://rss.upi.com/news/tn_us.rss
  - name: BBC World News
    url: https://feeds.bbci.co.uk/news/world/rss.xml
  - name: NBC News
    url: http://feeds.nbcnews.com/nbcnews/public/news
  - name: Vox — World
    url: https://www.vox.com/rss/world/index.xml
  - name: France 24
    url: https://www.france24.com/en/rss
  - name: Radio Free Europe/Radio Liberty
    url: https://www.rferl.org/api/
  - name: ProPublica
    url: https://www.propublica.org/feeds/propublica/main

tier2:
  markets:
    - name: Bloomberg Markets
      url: https://feeds.bloomberg.com/markets/news.rss
  soccer_world_cup:
