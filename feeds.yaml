# RSS feed sources for the podcast pipeline.
# Tier 1: digest-style general news (kept to a handful of headlines total).
# Tier 2: category-specific feeds, one list per category.

tier1_general_news:
  - name: PBS NewsHour Headlines
    url: https://www.pbs.org/newshour/feeds/rss/headlines
  - name: UPI Top News
    url: https://rss.upi.com/news/tn_us.rss
  - name: BBC World News
    url: https://feeds.bbci.co.uk/news/world/rss.xml

tier2:
  soccer_world_cup:
    - name: The Independent — World Cup
      url: http://www.independent.co.uk/sport/football/world-cup/rss
  tech_ai:
    - name: Daring Fireball
      url: https://daringfireball.net/feeds/main
  nfl:
    - name: ESPN NFL News
      url: https://www.espn.com/espn/rss/nfl/news
    - name: Bleeding Green Nation (Philadelphia Eagles)
      url: https://www.bleedinggreennation.com/rss/index.xml
  nwsl:
    - name: Just Women's Sports
      url: https://justwomenssports.com/feed/
  wnba:
    - name: Just Women's Sports
      url: https://justwomenssports.com/feed/
